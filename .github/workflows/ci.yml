name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + types + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Qt runtime libraries (Linux, for offscreen tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Create venv and install (core + ui + dev)
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[core,ui,dev]"

      # Point the app data dir at a fixed path both here and in pytest. conftest.py
      # isolates dirs with os.environ.setdefault, so a value set now is kept: the
      # model downloaded below lands where the tests look for it, turning
      # test_signed_binary_clears_to_safe_with_model from a skip into a real check.
      - name: Pin app data dir for the model + tests
        shell: bash
        run: |
          home="${RUNNER_TEMP}/prescan-data"
          mkdir -p "$home"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "LOCALAPPDATA=$home" >> "$GITHUB_ENV"
          else
            echo "XDG_DATA_HOME=$home" >> "$GITHUB_ENV"
          fi

      - name: Download ML model (real release asset, SHA-256 verified)
        run: uv run prescan update-model

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src/

      - name: Mypy (Windows platform)
        run: uv run mypy --platform win32 src/

      # §13.1: EICAR is a mandatory smoke test and must not pass silently by being
      # skipped. Bring up clamd on Linux so the test actually runs (-> DANGEROUS).
      - name: Bring up ClamAV daemon (for the EICAR smoke test, §13.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam || true
          sudo install -d -o clamav -g clamav /var/run/clamav
          sudo systemctl restart clamav-daemon || sudo service clamav-daemon restart || true
          for i in $(seq 1 90); do [ -S /var/run/clamav/clamd.ctl ] && break; sleep 2; done
          sudo chmod 666 /var/run/clamav/clamd.ctl
          ls -l /var/run/clamav/clamd.ctl

      - name: Pytest
        # -v prints each test name (so a pass/skip is legible without diffing runs);
        # -rs prints the reason for every skip so a hidden gap can't lurk behind an "s".
        # --cov reports core coverage (CLAUDE.md floor: >= 80% since M4).
        run: uv run pytest -v -rs --cov=prescan.core --cov-report=term
        env:
          QT_QPA_PLATFORM: offscreen

      # §13.2 is a mandatory test but carries the `slow` marker, so the default
      # `-m "not slow"` deselects it -- a mandatory test that runs nowhere. Run it
      # explicitly on Linux (real wall-clock, ~75 s) so it actually executes.
      - name: Pytest (slow / mandatory §13.2)
        if: runner.os == 'Linux'
        run: uv run pytest -m slow -v -rs
        env:
          QT_QPA_PLATFORM: offscreen
