name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + types + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Qt runtime libraries (Linux, for offscreen tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Create venv and install (core + ui + dev)
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[core,ui,dev]"

      # Point the app data dir at a fixed path both here and in pytest. conftest.py
      # isolates dirs with os.environ.setdefault, so a value set now is kept: the
      # model downloaded below lands where the tests look for it, turning
      # test_signed_binary_clears_to_safe_with_model from a skip into a real check.
      - name: Pin app data dir for the model + tests
        shell: bash
        run: |
          home="${RUNNER_TEMP}/prescan-data"
          mkdir -p "$home"
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "LOCALAPPDATA=$home" >> "$GITHUB_ENV"
          else
            echo "XDG_DATA_HOME=$home" >> "$GITHUB_ENV"
          fi

      - name: Download ML model (real release asset, SHA-256 verified)
        run: uv run prescan update-model

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src/

      - name: Mypy (Windows platform)
        run: uv run mypy --platform win32 src/

      - name: Pytest
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
