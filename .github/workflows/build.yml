name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Fail a tag-triggered run *before* the ~15 min build if the tag and the code
  # version disagree. Artifact names come from __version__ (not the tag), so a tag
  # pushed without bumping src/prescan/__init__.py would otherwise ship files whose
  # names silently mismatch the release. Non-tag runs skip the check and pass.
  guard:
    name: tag/version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag must equal "v" + __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(grep -oP '__version__\s*=\s*"\K[^"]+' src/prescan/__init__.py)
          echo "tag=${GITHUB_REF_NAME}  __version__=${ver}"
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != v${ver} (src/prescan/__init__.py) -- bump __version__ or retag"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not -latest: release binaries link against the runner's glibc, so
        # the moment GitHub moves ubuntu-latest to a newer glibc the artifacts would
        # silently stop installing on Ubuntu 24.04. ubuntu-24.04 (glibc 2.39) fixes the
        # minimum supported target; ci.yml keeps -latest where it is harmless.
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Create venv and install (core + ui + dev)
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[core,ui,dev]"

      - name: Compile translations (.qm)
        shell: bash
        run: |
          uv run pyside6-lrelease src/prescan/ui/i18n/prescan_ru.ts -qm src/prescan/ui/i18n/prescan_ru.qm
          uv run pyside6-lrelease src/prescan/ui/i18n/prescan_en.ts -qm src/prescan/ui/i18n/prescan_en.qm

      - name: Build the --onedir bundle (PyInstaller)
        run: uv run pyinstaller prescan.spec --noconfirm --distpath dist --workpath build

      - name: List bundle root + separate Qt libraries (§11.2 row 4, §11.3)
        # licenses/ are added by each packaging script (build-deb.sh, build-appimage.sh,
        # prescan.iss), not staged here -- a distribution without them cannot be built.
        shell: bash
        run: |
          echo "== bundle root =="
          ls -la dist/PreScan
          echo "== separate Qt libraries =="
          if [ "${{ runner.os }}" = "Windows" ]; then
            find dist/PreScan -name 'Qt6*.dll' | sort | head -40
            echo "Qt6*.dll count: $(find dist/PreScan -name 'Qt6*.dll' | wc -l)"
          else
            find dist/PreScan -name 'libQt6*.so.6' | sort | head -40
            echo "libQt6*.so.6 count: $(find dist/PreScan -name 'libQt6*.so.6' | wc -l)"
          fi

      # ---- Linux: .deb + AppImage + closed-loop in a clean container ------- #
      - name: Build .deb
        if: runner.os == 'Linux'
        run: bash packaging/build-deb.sh

      - name: Build AppImage
        if: runner.os == 'Linux'
        run: bash packaging/build-appimage.sh

      - name: Prove licenses/ ships inside the .deb (§11.5)
        if: runner.os == 'Linux'
        run: dpkg -c dist/prescan_*_amd64.deb | grep -E '/opt/prescan/licenses/' | head

      - name: Closed-loop from the INSTALLED .deb in ubuntu:24.04 (no Python; §12)
        if: runner.os == 'Linux'
        run: |
          set -e
          # §12: prove the PACKAGE runs on a clean Ubuntu without Python. apt installs
          # the .deb and pulls its Depends itself -- if a runtime lib were missing from
          # Depends the GUI would fail here (the run #1 libGL.so.1 error), after install.
          docker run --rm -e QT_QPA_PLATFORM=offscreen -v "$PWD/dist:/deb" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq /deb/prescan_*_amd64.deb
            prescan version
            prescan engines
            # The way a real user makes the installed app useful: fetch the model from
            # the release (SHA-256 checked) and confirm the ml engine flips to READY.
            # This also proves the frozen platformdirs paths resolve correctly.
            prescan update-model
            echo "== engines after update-model =="; prescan engines | grep -E "^ml "
            prescan scan /etc/hostname --no-network --quiet || true
            # GUI: survive the 8 s timeout AND print no fatal / ImportError / Traceback.
            # "|| code=$?" keeps set -e from treating the expected 124 as fatal.
            code=0; timeout 8 prescan 2>/tmp/gui.err || code=$?
            echo "gui exit=$code"; cat /tmp/gui.err
            if grep -qiE "Traceback|ImportError|fatal|cannot open shared object" /tmp/gui.err; then
              echo "GUI printed a fatal error"; exit 1
            fi
            if [ "$code" -ne 124 ]; then echo "GUI exited early ($code), did not stay up"; exit 1; fi
          '

      - name: Closed-loop from the AppImage in ubuntu:24.04 (§12)
        if: runner.os == 'Linux'
        run: |
          set -e
          docker run --rm -e QT_QPA_PLATFORM=offscreen -v "$PWD/dist:/app" ubuntu:24.04 bash -c '
            set -e
            # An AppImage declares no dependencies, so a bare image lacks the GL/GLib
            # libs the Qt platform needs -- install the minimal set a desktop has. If
            # one were missing it would surface here, before release.
            apt-get update -qq
            apt-get install -y -qq libgl1 libglib2.0-0 libegl1 libxkbcommon0 libdbus-1-3 >/dev/null
            img=$(ls /app/PreScan-*-x86_64.AppImage); chmod +x "$img"
            "$img" --appimage-extract-and-run version          # proves the AppImage runtime
            "$img" --appimage-extract >/dev/null               # extract once for the rest
            app=squashfs-root/usr/bin/PreScan/prescan
            "$app" engines
            "$app" scan /etc/hostname --no-network --quiet || true
            code=0; timeout 8 "$app" 2>/tmp/gui.err || code=$?
            echo "gui exit=$code"; cat /tmp/gui.err
            grep -qiE "Traceback|ImportError|fatal|cannot open shared object" /tmp/gui.err && exit 1
            [ "$code" -eq 124 ] || { echo "GUI did not stay up ($code)"; exit 1; }
            echo "== licenses inside the AppImage (§11.5) =="
            ls squashfs-root/usr/bin/PreScan/licenses | head
          '

      # ---- Windows: Inno Setup installer + trimmed-PATH smoke -------------- #
      - name: Ensure Inno Setup (ISCC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Take the version from the single source (prescan version) into ISCC.
          $v = (& uv run prescan version).Trim() -replace '^PreScan\s+',''
          iscc "/DAppVersion=$v" packaging\prescan.iss

      - name: Closed-loop from the INSTALLED package on Windows (§12)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # §12: install the Inno package silently, then run the installed exe from
          # Program Files with the runner's Python dirs stripped from PATH, then
          # uninstall silently. Caveat (stated in the report): Python is still present
          # on the runner, so a truly virgin Windows is NOT proven -- only that the
          # installed package runs without depending on the runner's Python.
          $ErrorActionPreference = 'Stop'
          function Invoke-Timed($exe, $argv, $sec) {
            $p = Start-Process -FilePath $exe -ArgumentList $argv -NoNewWindow -PassThru
            if (-not $p.WaitForExit($sec * 1000)) { $p.Kill(); throw "TIMEOUT: $exe $argv" }
            return $p.ExitCode
          }
          $setup = (Get-ChildItem dist\PreScan-Setup-*.exe)[0].FullName
          # /SUPPRESSMSGBOXES so no dialog can wait forever on a headless runner.
          Write-Host "== install =="
          Invoke-Timed $setup '/VERYSILENT /NORESTART /SUPPRESSMSGBOXES' 300 | Out-Null
          $app = "C:\Program Files\PreScan"
          Write-Host "== installed licenses (§11.5) =="; Get-ChildItem "$app\licenses" | Select-Object -First 5 Name
          $env:PATH = "C:\Windows\System32;C:\Windows"
          Write-Host "== version =="; Invoke-Timed "$app\prescan.exe" 'version' 60 | Out-Null
          Write-Host "== engines =="; Invoke-Timed "$app\prescan.exe" 'engines' 120 | Out-Null
          Write-Host "== uninstall =="
          # Inno's uninstaller finishes cleanup in a detached process, so checking the
          # dir immediately races it; report the uninstaller's own exit code instead.
          $uc = Invoke-Timed "$app\unins000.exe" '/VERYSILENT /SUPPRESSMSGBOXES' 300
          Write-Host "uninstaller exit=$uc"

      # ---- Artifacts ------------------------------------------------------- #
      - name: Read version (for artifact names)
        id: ver
        shell: bash
        run: echo "v=$(uv run prescan version | sed -E 's/^PreScan //')" >> "$GITHUB_OUTPUT"

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: prescan-linux-${{ steps.ver.outputs.v }}
          path: |
            dist/prescan_*_amd64.deb
            dist/PreScan-*-x86_64.AppImage

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: prescan-windows-${{ steps.ver.outputs.v }}
          path: |
            dist/PreScan-Setup-*.exe
