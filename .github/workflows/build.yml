name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      - name: Create venv and install (core + ui + dev)
        run: |
          uv venv --python 3.12 .venv
          uv pip install -e ".[core,ui,dev]"

      - name: Compile translations (.qm)
        shell: bash
        run: |
          uv run pyside6-lrelease src/prescan/ui/i18n/prescan_ru.ts -qm src/prescan/ui/i18n/prescan_ru.qm
          uv run pyside6-lrelease src/prescan/ui/i18n/prescan_en.ts -qm src/prescan/ui/i18n/prescan_en.qm

      - name: Build the --onedir bundle (PyInstaller)
        run: uv run pyinstaller prescan.spec --noconfirm --distpath dist --workpath build

      # ---- Linux: .deb + closed-loop in a clean container ------------------ #
      - name: Build .deb
        if: runner.os == 'Linux'
        run: bash packaging/build-deb.sh

      - name: Closed-loop in ubuntu:24.04 (no Python; §6.1 degradation)
        if: runner.os == 'Linux'
        run: |
          set -e
          run() { docker run --rm -e QT_QPA_PLATFORM=offscreen -v "$PWD/dist:/app" ubuntu:24.04 "$@"; }
          run /app/PreScan/prescan version
          run /app/PreScan/prescan engines
          run sh -c '/app/PreScan/prescan scan /app/PreScan/prescan --no-network --quiet' || true
          # GUI must load, not crash (build host glibc matches the container here):
          run sh -c 'timeout 8 /app/PreScan/prescan; test $? -eq 124'

      # ---- Windows: Inno Setup installer + trimmed-PATH smoke -------------- #
      - name: Ensure Inno Setup (ISCC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Take the version from the single source (prescan version) into ISCC.
          $v = (& uv run prescan version).Trim() -replace '^PreScan\s+',''
          iscc "/DAppVersion=$v" packaging\prescan.iss

      - name: Closed-loop with a trimmed PATH (approximation — Python is installed)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Drop the runner's Python dirs from PATH so the frozen exe uses only its
          # own bundled runtime. This is an approximation: Python is still installed
          # on the runner, so §12 "runs on clean Windows without Python" is not fully
          # proven here — only that the exe does not depend on the runner's Python.
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & dist\PreScan\prescan.exe version
          & dist\PreScan\prescan.exe engines

      # ---- Artifacts ------------------------------------------------------- #
      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: prescan-linux
          path: |
            dist/prescan_*_amd64.deb

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: prescan-windows
          path: |
            dist/PreScan-Setup-*.exe
