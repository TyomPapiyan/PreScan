[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prescan"
version = "0.0.0"
description = "Pre-execution malware and link scanner (signal aggregator + ML)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "PreScan contributors" }]
keywords = ["security", "malware", "antivirus", "clamav", "yara"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# Runtime dependencies live in the named optional-dependency groups below
# (core / ui / ml). RinUI is intentionally absent: it is vendored into
# ui/vendor/RinUI/ and must never be a resolvable dependency (see spec §16.7).
dependencies = []

[project.optional-dependencies]
# --------------------------------------------------------------------------- #
# core: the pure-Python engine. No Qt here (architectural ban §10.1).
# --------------------------------------------------------------------------- #
core = [
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "keyring==25.7.0",
    "typer==0.27.1",
    "yara-x==1.20.0",
    "lief==1.0.0",
    "puremagic==2.2.0",
    "ppdeep==20260221",
    "py7zr==1.1.3",
    "oletools==0.60.2",
    "onnxruntime==1.29.0",
    "platformdirs==4.11.5",
    "jinja2==3.1.6",
    "tenacity==9.1.4",
    "pyzipper==0.4.0",
    "pikepdf==10.12.0",
    "numpy==2.5.2",
    # pefile is a runtime inference dependency (§3.4: onnxruntime + numpy + pefile),
    # so it lives in core, not ml.
    "pefile==2024.8.26",
]

# --------------------------------------------------------------------------- #
# ui: the thin Qt layer. RinUI is vendored, not listed here.
# --------------------------------------------------------------------------- #
ui = [
    "PySide6==6.11.2",
    "qasync==0.28.0",
    # pytest-qt lives here (not in dev) so it is present exactly when a Qt binding
    # is. UI tests self-skip without it via tests/ui/conftest.py — no manual flag.
    "pytest-qt==4.5.0",
]

# --------------------------------------------------------------------------- #
# ml: research + model-conversion tooling. Not shipped with the app.
# --------------------------------------------------------------------------- #
ml = [
    # pefile is declared in `core` (runtime inference dep, §3.4); the ml tooling
    # below reuses it.
    "lightgbm==4.7.0",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "pandas>=2.2",
    "onnx>=1.17",
    "onnxmltools>=1.12",
    # thrember is installed from git (EMBER2024), never from PyPI. See ml/README.md.
]

# --------------------------------------------------------------------------- #
# dev: lint, type-check, test, build.
# --------------------------------------------------------------------------- #
dev = [
    "ruff==0.16.5",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx==0.23.1",
    "pyinstaller>=6.10",
]

[project.scripts]
prescan = "prescan.cli:app"

[project.urls]
Homepage = "https://github.com/prescan/prescan"
Repository = "https://github.com/prescan/prescan"

[tool.hatch.build.targets.wheel]
packages = ["src/prescan"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Markdown is documentation, not source. Ruff 0.16 reformats Python fences inside
# .md files; keep PRESCAN-SPEC.md and other docs verbatim. Vendored RinUI is
# third-party code (§11.2) and is not linted or type-checked.
extend-exclude = ["*.md", "src/prescan/ui/vendor"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # ruff-specific
    "BLE",  # flake8-blind-except (§10.4: intentional broad catches carry a noqa)
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# §10.1: core/ must not depend on Qt. Enforced here and by
# tests/unit/test_core_has_no_qt.py.
"PySide6".msg = "core/ must not depend on Qt. UI code belongs in ui/."
"qasync".msg = "core/ must not depend on Qt."

[tool.ruff.lint.per-file-ignores]
# IDN-homograph tests deliberately embed a Cyrillic 'а' to exercise detection.
"tests/unit/test_url_normalize.py" = ["RUF001", "RUF003"]
"tests/unit/test_url_heuristics.py" = ["RUF001", "RUF003"]
# The Qt UI layer follows Qt naming (mixedCase signals/properties/slots) and is
# the one place Qt may be imported (§10.1 bans it in core/, enforced there +
# by tests/unit/test_core_has_no_qt.py).
"src/prescan/ui/**" = ["N802", "N815", "N803", "TID251"]
# UI tests exercise the Qt layer and legitimately import PySide6.
"tests/ui/**" = ["TID251", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["prescan"]

[tool.ruff.format]
docstring-code-format = true

# --------------------------------------------------------------------------- #
# Mypy — strict mode (§12 M0)
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
# warn_unreachable is intentionally OFF: platform-specific branches (Windows-only
# Defender code) read as "unreachable" when mypy runs on Linux and vice versa.
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src"]
exclude = ["src/prescan/ui/vendor/"]

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = [
    "ppdeep.*",
    "puremagic.*",
    "oletools.*",
    "pyzipper.*",
    "lief.*",
    "yara_x.*",
    "qasync.*",
    "pefile.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
# Slow tests (real wall-clock pacing) are excluded by default to keep CI fast and
# flake-free; run them explicitly with `pytest -m slow`.
addopts = "-ra --strict-markers --strict-config -m 'not slow'"
markers = [
    "slow: real wall-clock test (e.g. rate-limiter pacing); excluded by default, run with -m slow",
]

[tool.coverage.run]
source = ["prescan.core"]
branch = true

[tool.coverage.report]
show_missing = true
